<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="100%" height="100%" fill="none">
  <defs>
    <!-- Camera Body Gradient -->
    <linearGradient id="camBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2f36"/>
      <stop offset="30%" stop-color="#1d1f24"/>
      <stop offset="70%" stop-color="#141518"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>

    <!-- Metallic Titanium Rim -->
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#808896"/>
      <stop offset="25%" stop-color="#41454e"/>
      <stop offset="50%" stop-color="#a8b2c2"/>
      <stop offset="75%" stop-color="#2d3036"/>
      <stop offset="100%" stop-color="#646b77"/>
    </linearGradient>

    <!-- Glass Optics Deep Blue Reflection -->
    <radialGradient id="opticReflect" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#1d4ed8" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <radialGradient id="innerLens" cx="48%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#020617"/>
    </radialGradient>

    <filter id="lensGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="bodyShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#bodyShadow)">
    <!-- Main Camera Chassis (Three-Quarter Front Angle) -->
    <!-- Top Handle / Rigging -->
    <rect x="260" y="140" width="220" height="38" rx="8" fill="#1e2025" stroke="#4b5160" stroke-width="2"/>
    <rect x="290" y="178" width="30" height="42" fill="#16181c" stroke="#373c47" stroke-width="1.5"/>
    <rect x="420" y="178" width="30" height="42" fill="#16181c" stroke="#373c47" stroke-width="1.5"/>
    
    <!-- Top Audio/Mic Unit / Cold Shoe -->
    <rect x="240" y="210" width="260" height="32" rx="6" fill="#252830" stroke="#505666" stroke-width="1.5"/>
    <circle cx="260" cy="226" r="6" fill="#0f1013" stroke="#ff4d4d" stroke-width="1"/>
    <rect x="440" y="218" width="45" height="15" rx="3" fill="#121316" stroke="#414652" stroke-width="1"/>

    <!-- Main Magnesium Body -->
    <path d="M 180 238 L 560 238 L 590 280 L 590 600 L 160 600 L 160 280 Z" fill="url(#camBody)" stroke="url(#metalRim)" stroke-width="3"/>

    <!-- Right Handgrip Contour (Textured Ergonomic Grip) -->
    <path d="M 560 270 C 630 290, 660 360, 650 490 C 645 540, 610 595, 570 600 Z" fill="#181a1f" stroke="#3f4450" stroke-width="2"/>
    <!-- Grip Textured Ribs -->
    <line x1="585" y1="340" x2="625" y2="360" stroke="#2c3038" stroke-width="3" stroke-linecap="round"/>
    <line x1="585" y1="380" x2="628" y2="400" stroke="#2c3038" stroke-width="3" stroke-linecap="round"/>
    <line x1="580" y1="420" x2="625" y2="440" stroke="#2c3038" stroke-width="3" stroke-linecap="round"/>
    <line x1="575" y1="460" x2="618" y2="480" stroke="#2c3038" stroke-width="3" stroke-linecap="round"/>

    <!-- Shutter & Control Dials on Top Right -->
    <rect x="580" y="248" width="40" height="18" rx="4" fill="#646b78" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="600" cy="257" r="5" fill="#181a1f"/>
    <rect x="525" y="222" width="34" height="18" rx="3" fill="#32353e" stroke="#5d6372" stroke-width="1.5"/>

    <!-- Viewfinder / Eyepiece on Top Left -->
    <rect x="180" y="200" width="55" height="42" rx="6" fill="#1c1e23" stroke="#484d5a" stroke-width="1.5"/>
    <circle cx="207" cy="221" r="14" fill="#0c0d10" stroke="#2a2c33" stroke-width="2"/>
    <circle cx="207" cy="221" r="9" fill="#1e3a8a" fill-opacity="0.4"/>

    <!-- Lens Mount & Barrel Base -->
    <rect x="230" y="280" width="260" height="270" rx="20" fill="#17181c" stroke="#333742" stroke-width="2"/>
    <circle cx="360" cy="415" r="150" fill="#20232a" stroke="url(#metalRim)" stroke-width="5"/>
    <circle cx="360" cy="415" r="136" fill="#131417" stroke="#3d424e" stroke-width="3"/>

    <!-- Lens Focus & Zoom Ribbed Rings -->
    <circle cx="360" cy="415" r="126" fill="none" stroke="#2a2d36" stroke-width="8" stroke-dasharray="3 3"/>
    <circle cx="360" cy="415" r="114" fill="#101114" stroke="#4c5362" stroke-width="2.5"/>

    <!-- Lens Aperture & Optics Elements -->
    <circle cx="360" cy="415" r="102" fill="url(#opticReflect)"/>
    <circle cx="360" cy="415" r="76" fill="url(#innerLens)"/>

    <!-- Iris Aperture Blades (Geometric Elegance) -->
    <polygon points="360,365 395,385 395,435 360,455 325,435 325,385" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="360" cy="415" r="32" fill="#020617"/>

    <!-- Cinematic Optical Flares / Highlights on Front Element -->
    <ellipse cx="325" cy="375" rx="35" ry="18" transform="rotate(-30 325 375)" fill="#60a5fa" fill-opacity="0.35" filter="url(#lensGlow)"/>
    <circle cx="318" cy="365" r="6" fill="#ffffff" fill-opacity="0.75"/>
    <ellipse cx="395" cy="460" rx="28" ry="12" transform="rotate(35 395 460)" fill="#38bdf8" fill-opacity="0.25"/>

    <!-- Sensor / Tally Indicator Light (Discreet White/Red Ring) -->
    <circle cx="510" cy="290" r="7" fill="#1e2026" stroke="#484d59" stroke-width="1.5"/>
    <circle cx="510" cy="290" r="3.5" fill="#ef4444" fill-opacity="0.75"/>

    <!-- Body Accent Bevel Lines -->
    <line x1="165" y1="285" x2="225" y2="285" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25"/>
    <line x1="165" y1="285" x2="165" y2="595" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.15"/>
  </g>
</svg>
