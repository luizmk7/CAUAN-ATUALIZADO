<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background / Body Shading -->
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24262b"/>
      <stop offset="35%" stop-color="#18191c"/>
      <stop offset="70%" stop-color="#111215"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>

    <!-- Titanium Outer Frame -->
    <linearGradient id="frameRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a818e"/>
      <stop offset="20%" stop-color="#3a3d45"/>
      <stop offset="50%" stop-color="#9ea7b7"/>
      <stop offset="75%" stop-color="#22252a"/>
      <stop offset="100%" stop-color="#565c69"/>
    </linearGradient>

    <!-- Camera Plateau -->
    <linearGradient id="plateauGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2f37"/>
      <stop offset="50%" stop-color="#191b20"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>

    <!-- Lens Glass Reflection -->
    <linearGradient id="lensReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="40%" stop-color="#0b1322"/>
      <stop offset="70%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#25476a"/>
    </linearGradient>

    <!-- Rim Light Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow for Camera Bump -->
    <filter id="bumpShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Phone Chassis with subtle 3D tilt perspective -->
  <g transform="rotate(-4 250 400)">
    <!-- Outer Titanium Bezel -->
    <rect x="70" y="50" width="360" height="700" rx="56" fill="url(#frameRim)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35"/>

    <!-- Inner Dark Glass Body -->
    <rect x="76" y="56" width="348" height="688" rx="50" fill="url(#phoneBody)" stroke="#1a1c22" stroke-width="2"/>

    <!-- Subtle Edge Reflection along the right side -->
    <path d="M 420 120 L 420 680" stroke="#9bb1cf" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>

    <!-- Subtle Edge Reflection along the top left -->
    <path d="M 120 58 L 380 58" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.45" stroke-linecap="round"/>

    <!-- Camera Plateau / Island (Top Left) -->
    <rect x="96" y="80" width="168" height="178" rx="36" fill="url(#plateauGrad)" stroke="#494f5c" stroke-width="1.5" filter="url(#bumpShadow)"/>
    
    <!-- Plateau Edge Highlights -->
    <rect x="98" y="82" width="164" height="174" rx="34" fill="none" stroke="#687285" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Lens 1: Top Main Camera -->
    <g transform="translate(142, 130)">
      <circle cx="0" cy="0" r="30" fill="#0d0f12" stroke="#484d59" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="25" fill="#13161c" stroke="#252932" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="20" fill="url(#lensReflect)"/>
      <circle cx="-6" cy="-6" r="6" fill="#60a5fa" fill-opacity="0.4" filter="url(#softGlow)"/>
      <circle cx="7" cy="7" r="3" fill="#93c5fd" fill-opacity="0.3"/>
      <circle cx="0" cy="0" r="10" fill="#05080e"/>
      <circle cx="-3" cy="-3" r="2" fill="#ffffff" fill-opacity="0.8"/>
    </g>

    <!-- Lens 2: Bottom Ultrawide Camera -->
    <g transform="translate(142, 208)">
      <circle cx="0" cy="0" r="30" fill="#0d0f12" stroke="#484d59" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="25" fill="#13161c" stroke="#252932" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="20" fill="url(#lensReflect)"/>
      <circle cx="-6" cy="-6" r="6" fill="#60a5fa" fill-opacity="0.4" filter="url(#softGlow)"/>
      <circle cx="7" cy="7" r="3" fill="#93c5fd" fill-opacity="0.3"/>
      <circle cx="0" cy="0" r="10" fill="#05080e"/>
      <circle cx="-3" cy="-3" r="2" fill="#ffffff" fill-opacity="0.8"/>
    </g>

    <!-- Lens 3: Right Telephoto Camera -->
    <g transform="translate(218, 169)">
      <circle cx="0" cy="0" r="30" fill="#0d0f12" stroke="#484d59" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="25" fill="#13161c" stroke="#252932" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="20" fill="url(#lensReflect)"/>
      <circle cx="-6" cy="-6" r="6" fill="#60a5fa" fill-opacity="0.4" filter="url(#softGlow)"/>
      <circle cx="7" cy="7" r="3" fill="#93c5fd" fill-opacity="0.3"/>
      <circle cx="0" cy="0" r="10" fill="#05080e"/>
      <circle cx="-3" cy="-3" r="2" fill="#ffffff" fill-opacity="0.8"/>
    </g>

    <!-- Flash Module -->
    <circle cx="218" cy="112" r="12" fill="#e2e8f0" fill-opacity="0.85" stroke="#4a505e" stroke-width="1.5"/>
    <circle cx="218" cy="112" r="7" fill="#fef08a" fill-opacity="0.6"/>

    <!-- LiDAR / Sensor Ring -->
    <circle cx="218" cy="226" r="8" fill="#111317" stroke="#2d313b" stroke-width="1.5"/>
    <circle cx="218" cy="226" r="4" fill="#060709"/>

    <!-- Mic Hole -->
    <circle cx="180" cy="236" r="2.5" fill="#1c1f26"/>

    <!-- Subtle vertical satin gloss across phone back -->
    <path d="M 170 56 L 270 56 L 210 744 L 110 744 Z" fill="#ffffff" fill-opacity="0.025"/>
  </g>
</svg>
